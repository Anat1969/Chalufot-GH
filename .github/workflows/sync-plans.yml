# סנכרון לילי של התכניות מתואם מתאר ומ"מה נבנה סביבי". רץ בלי Claude ובלי אישורים: קריאה ציבורית בלבד.
# חלון התחזוקה: 19:30 עד 22:00 UTC (21:30 עד 00:00 שעון ישראל בחורף). קומיט, ולכן פריסה, רק כשהנתונים השתנו.
name: sync-plans
on:
  schedule:
    - cron: '41 19 * * *'
  workflow_dispatch:
  # בכל שינוי בקוד הסנכרון: ריצה מיד, בלי לחכות ללילה.
  push:
    branches: [main]
    paths: ['scripts/sync_plans.py', '.github/workflows/sync-plans.yml']
permissions:
  contents: write
concurrency:
  group: sync-plans
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read all sources and rebuild plans
        run: python3 scripts/sync_plans.py | tee sync.log
      - name: Anything changed?
        id: diff
        run: |
          git add src/data/plans.json public/maps
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Tests on the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npm run build:github
      - name: Commit once (one Vercel deployment)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/plans.json public/maps app
          git commit -m "סנכרון לילי: תכניות מתואם מתאר ומ\"מה נבנה סביבי\""
          # workflow אחר (build-app) עלול לדחוף ל-main באותו רגע: מושכים, מעבירים את הקומיט מעליו, ומנסים שוב.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main
            sleep $((i * 5))
          done
          exit 1
      - name: Summary
        run: |
          python3 -c "import json;d=json.load(open('src/data/plans.json'));print('snapshot',d['snapshot'],'plans',len(d['plans']),'lots',sum(len(p['lots']) for p in d['plans']))" >> "$GITHUB_STEP_SUMMARY"
          echo "changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          grep '^skipped:' sync.log >> "$GITHUB_STEP_SUMMARY" || true
